[project]
name = "blu"
version = "0.1.0"
description = "Blu ingestion SDK (generated by Fern from OpenAPI)"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.21.2",
    "pydantic>=2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["blu*"]